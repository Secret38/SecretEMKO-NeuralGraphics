name: Build Secret EMKO v2 RenoDX

on:
  workflow_dispatch:
  push:
    branches: [ main, hardening-universal-fivem-installer ]
    paths:
      - "v2/**"
      - ".github/workflows/build-v2-renodx.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/build-v2-renodx.yml"

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout Secret EMKO
        uses: actions/checkout@v4

      - name: Toolchain
        shell: powershell
        run: |
          git --version
          cmake --version

      - name: Validate PowerShell + live ReShade catalogs
        shell: powershell
        run: |
          $scripts = @(
            ".\v2\tools\Install-SecretEMKO.ps1",
            ".\v2\tools\Update-ReShadeContent.ps1",
            ".\v2\tools\Prepare-FiveMPlugins.ps1",
            ".\v2\tools\Uninstall-SecretEMKO.ps1",
            ".\v2\tools\build.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
          .\v2\tools\Update-ReShadeContent.ps1 -TargetDirectory "$env:RUNNER_TEMP\SecretEmkoDryRun" -DryRun -SkipCoreCheck

          # Exercise clean-room isolation and idempotent re-run semantics.
          $mock = Join-Path $env:RUNNER_TEMP "SecretEmkoMock\FiveM.app"
          $plugins = Join-Path $mock "plugins"
          New-Item -ItemType Directory -Path $plugins -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $mock "CitizenFX.ini") -Value "[Game]"
          Set-Content -LiteralPath (Join-Path $plugins "legacy.txt") -Value "preserve-me"

          $first = (.\v2\tools\Prepare-FiveMPlugins.ps1 -PluginsPath $plugins | ConvertFrom-Json)
          if (-not $first.isolated_existing_plugins) { throw "Expected existing plugins to be isolated." }
          if (Test-Path (Join-Path $plugins "legacy.txt")) { throw "Legacy file leaked into clean plugins directory." }
          if (-not (Test-Path (Join-Path $first.original_plugins_backup_path "legacy.txt"))) { throw "Legacy plugins backup is incomplete." }

          New-Item -ItemType Directory -Path (Join-Path $plugins "SecretEMKO") -Force | Out-Null
          @{ product = "SECRET EMKO Neural Graphics"; original_plugins_backup_path = $first.original_plugins_backup_path } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $plugins "SecretEMKO\install-state.json")
          $second = (.\v2\tools\Prepare-FiveMPlugins.ps1 -PluginsPath $plugins | ConvertFrom-Json)
          if (-not $second.existing_secret_emko) { throw "Expected idempotent SECRET EMKO re-run detection." }
          if ($second.original_plugins_backup_path -ne $first.original_plugins_backup_path) { throw "Original backup pointer changed on re-run." }

      - name: Build RenoDX-native addon and package
        shell: powershell
        run: |
          .\v2\tools\build.ps1

      - name: Verify release files
        shell: powershell
        run: |
          $stage = ".\v2\dist\SecretEMKO-NeuralGraphics-v2.0.0-rc2"
          $required = @(
            "SecretEMKO.addon64",
            "dlss5-bridge.addon64",
            "INSTALL_SECRET_EMKO.bat",
            "tools\Install-SecretEMKO.ps1",
            "tools\Update-ReShadeContent.ps1",
            "tools\Prepare-FiveMPlugins.ps1",
            "config\ReShade.SecretEMKO.ini",
            "presets\Secret_Emko_Main.ini",
            "presets\Secret_Emko_Stream.ini",
            "MAIN-SYSTEM.json",
            "README.md",
            "VERSIONS.json"
          )
          foreach ($f in $required) {
            $p = Join-Path $stage $f
            if (-not (Test-Path $p)) { throw "Missing release file: $f" }
          }
          Get-FileHash "$stage\SecretEMKO.addon64" -Algorithm SHA256
          Get-FileHash "$stage\dlss5-bridge.addon64" -Algorithm SHA256

      - name: Upload v2 package
        uses: actions/upload-artifact@v4
        with:
          name: SecretEMKO-NeuralGraphics-v2.0.0-rc2
          path: |
            v2/dist/SecretEMKO-NeuralGraphics-v2.0.0-rc2/**
            v2/dist/SecretEMKO-NeuralGraphics-v2.0.0-rc2.zip
          if-no-files-found: error
