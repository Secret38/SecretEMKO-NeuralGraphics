name: Build Secret EMKO v2 RenoDX

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "v2/**"
      - ".github/workflows/build-v2-renodx.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "v2/**"
      - ".github/workflows/build-v2-renodx.yml"

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout Secret EMKO
        uses: actions/checkout@v4

      - name: Toolchain
        shell: powershell
        run: |
          git --version
          cmake --version

      - name: Validate PowerShell scripts
        shell: powershell
        run: |
          $scripts = @(
            ".\v2\tools\Install-SecretEMKO.ps1",
            ".\v2\tools\Uninstall-SecretEMKO.ps1",
            ".\v2\tools\Update-ReShadeContent.ps1",
            ".\v2\tools\build.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }

      - name: Validate live ReShade packages
        shell: powershell
        run: |
          $target = "$env:RUNNER_TEMP\SecretEmkoReShadeIntegration"
          .\v2\tools\Update-ReShadeContent.ps1 -TargetDirectory $target -SkipCoreCheck
          $required = @(
            "ReShade.ini",
            "swapchain_override.addon64",
            "Secret_Emko_Main.ini",
            "Secret_Emko_Stream.ini"
          )
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path $target $name))) { throw "Missing ReShade integration output: $name" }
          }

      - name: Validate official Full Add-on headless setup
        shell: powershell
        run: |
          $landingPage = Invoke-WebRequest -UseBasicParsing -Uri "https://reshade.me/"
          if ($landingPage.Content -notmatch 'Version\s+([0-9]+\.[0-9]+\.[0-9]+)') { throw "Could not resolve ReShade version" }
          $version = $Matches[1]
          $setup = Join-Path $env:RUNNER_TEMP ("ReShade_Setup_" + $version + "_Addon.exe")
          $url = "https://reshade.me/downloads/ReShade_Setup_" + $version + "_Addon.exe"
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $setup
          $target = Join-Path $env:RUNNER_TEMP "SecretEmkoFullAddon"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $targetExe = Join-Path $target "_SecretEMKO_ReShadeHost.exe"
          Copy-Item "$env:WINDIR\System32\notepad.exe" $targetExe -Force
          $quotedTarget = '"' + $targetExe + '"'
          $p = Start-Process -FilePath $setup -ArgumentList @("--headless","--api","dxgi",$quotedTarget) -Wait -PassThru
          Remove-Item $targetExe -Force -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Full Add-on setup failed with $($p.ExitCode)" }
          $dll = Join-Path $target "dxgi.dll"
          if (-not (Test-Path $dll)) { throw "Full Add-on dxgi.dll missing" }
          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($dll))
          if ($ascii.Contains("only limited add-on functionality")) { throw "Expected Full Add-on build, detected limited standard build" }

      - name: Reject source ZIP Full Neural before FiveM modification
        shell: powershell
        run: |
          $fake = Join-Path $env:RUNNER_TEMP "SecretEMKO Source ZIP Preflight"
          $app = Join-Path $fake "FiveM.app"
          $plugins = Join-Path $app "plugins"
          New-Item -ItemType Directory -Path $plugins -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $app "CitizenFX.ini") -Value "[Game]"
          Set-Content -LiteralPath (Join-Path $plugins "sentinel.txt") -Value "must-remain"

          $failed = $false
          try {
            .\v2\tools\Install-SecretEMKO.ps1 -FiveMPath $fake -Mode FullNeural -ForceNeuralStack -NonInteractive
          }
          catch {
            $failed = $true
            if ($_.Exception.Message -notmatch "built RC5 artifact") { throw }
          }

          if (-not $failed) { throw "Source tree unexpectedly accepted Full Neural." }
          if (-not (Test-Path (Join-Path $plugins "sentinel.txt"))) { throw "Source preflight modified the existing plugins folder." }
          if (@(Get-ChildItem -LiteralPath $app -Directory -Filter "plugins.before-secret-emko.*").Count -ne 0) { throw "Source preflight isolated plugins before package validation." }

      - name: Validate pinned RenoDX v4.70 live-control binary
        shell: powershell
        run: |
          $url = "https://github.com/RankFTW/rhi-repo/releases/download/renodx-dlss5-4.70/renodx-dlss5_4.70.zip"
          $zip = Join-Path $env:RUNNER_TEMP "renodx-dlss5_4.70.zip"
          $dir = Join-Path $env:RUNNER_TEMP "renodx-dlss5_4.70"
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $zip
          $packageHash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($packageHash -ine "D6E356D01B429AF6288F488A4926C44F1D779A7D4586EE8C79D04D3A09A536E6") {
            throw "Unexpected RenoDX v4.70 package hash: $packageHash"
          }
          Expand-Archive $zip $dir -Force
          $consumer = Get-ChildItem $dir -Recurse -File -Filter "renodx-dlss5*.addon64" | Select-Object -First 1
          if (-not $consumer) { throw "RenoDX DLSS5 consumer missing from pinned package" }
          if ($consumer.Length -ne 1732608) { throw "Unexpected RenoDX consumer size: $($consumer.Length)" }
          $hash = (Get-FileHash $consumer.FullName -Algorithm SHA256).Hash
          if ($hash -ine "D5ADF82EB44B065F4C590AC91FE824BAB07AFEA0EB9F994BDE936710C8593952") {
            throw "RenoDX live-control binary changed: $hash"
          }

          $bytes = [IO.File]::ReadAllBytes($consumer.FullName)

          function Get-U16([int]$Offset) {
            return [BitConverter]::ToUInt16($bytes, $Offset)
          }
          function Get-U32([int]$Offset) {
            return [BitConverter]::ToUInt32($bytes, $Offset)
          }
          function Convert-RvaToRaw([uint32]$Rva) {
            $pe = [int](Get-U32 0x3C)
            if ([Text.Encoding]::ASCII.GetString($bytes, $pe, 4) -ne ("PE" + [char]0 + [char]0)) {
              throw "Pinned RenoDX consumer is not a valid PE image"
            }

            $sectionCount = [int](Get-U16 ($pe + 6))
            $optionalSize = [int](Get-U16 ($pe + 20))
            $sectionTable = $pe + 24 + $optionalSize

            for ($s = 0; $s -lt $sectionCount; $s++) {
              $entry = $sectionTable + ($s * 40)
              $virtualSize = [uint32](Get-U32 ($entry + 8))
              $virtualAddress = [uint32](Get-U32 ($entry + 12))
              $rawSize = [uint32](Get-U32 ($entry + 16))
              $rawPointer = [uint32](Get-U32 ($entry + 20))
              $span = [Math]::Max([uint64]$virtualSize, [uint64]$rawSize)
              if ([uint64]$Rva -ge [uint64]$virtualAddress -and
                  [uint64]$Rva -lt ([uint64]$virtualAddress + $span)) {
                return [int]([uint64]$rawPointer + ([uint64]$Rva - [uint64]$virtualAddress))
              }
            }
            throw ("RVA 0x{0:X} is not backed by a PE section" -f $Rva)
          }

          function Assert-RvaBytes([uint32]$Rva, [byte[]]$Expected, [string]$Name) {
            $raw = Convert-RvaToRaw $Rva
            for ($i = 0; $i -lt $Expected.Length; $i++) {
              if ($bytes[$raw + $i] -ne $Expected[$i]) {
                throw ("$Name fingerprint mismatch at RVA 0x{0:X}" -f ($Rva + $i))
              }
            }
          }

          Assert-RvaBytes 0x23ff8 ([byte[]](0xB9,0x32,0x4B,0x00,0x00,0xFF,0xD0,0x48,0x89,0x05,0x9A,0x2C,0x17,0x00)) "RenoDX init"
          Assert-RvaBytes 0x2607c ([byte[]](0x48,0x8D,0x15,0x7D,0x45,0x00,0x00,0xFF,0xD0)) "RenoDX settings callback"

          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($requiredString in @(
            "RenoDX-DLSSNR",
            "Enable DLSS Neural Rendering",
            "Overall Intensity",
            "Global Tone Intensity",
            "Local Tone Intensity",
            "Structure Intensity",
            "Character/Skin Structure",
            "Automatic / Character Mask",
            "NR UI Correction",
            "NR Preset",
            "NR Style",
            "Depth Convention"
          )) {
            if (-not $ascii.Contains($requiredString)) {
              throw "Pinned RenoDX binary is missing live-control contract string: $requiredString"
            }
          }

      - name: Build RenoDX-native addon and package
        shell: powershell
        run: |
          .\v2\tools\build.ps1

      - name: Verify release files
        shell: powershell
        run: |
          $stage = ".\v2\dist\SecretEMKO-NeuralGraphics-v2.0.0-rc5"
          $required = @(
            "SecretEMKO.addon64",
            "SecretEMKO-FG.addon64",
            "dlss5-bridge.addon64",
            "INSTALL_SECRET_EMKO.bat",
            "INSTALL_SECRET_EMKO_FULL_NEURAL.bat",
            "UNINSTALL_SECRET_EMKO.bat",
            "tools\Install-SecretEMKO.ps1",
            "tools\Uninstall-SecretEMKO.ps1",
            "tools\Update-ReShadeContent.ps1",
            "config\ReShade.SecretEMKO.ini",
            "presets\Secret_Emko_Main.ini",
            "presets\Secret_Emko_Stream.ini",
            "MAIN-SYSTEM.json",
            "COMPATIBILITY.md",
            "FRAMEGEN-NATIVE.md",
            "README.md",
            "VERSIONS.json",
            "licenses\DLSS5-Swapper-LICENSE.txt"
          )
          foreach ($f in $required) {
            $p = Join-Path $stage $f
            if (-not (Test-Path $p)) { throw "Missing release file: $f" }
          }
          Get-FileHash "$stage\SecretEMKO.addon64" -Algorithm SHA256
          Get-FileHash "$stage\SecretEMKO-FG.addon64" -Algorithm SHA256
          Get-FileHash "$stage\dlss5-bridge.addon64" -Algorithm SHA256

          $versions = Get-Content ".\v2\VERSIONS.json" -Raw | ConvertFrom-Json
          if ($versions.version -ne "2.0.0-rc5") { throw "VERSIONS.json is not RC5" }
          if ($versions.components.dlss5_bridge.version -ne "1.4.13-pre8") { throw "Wrong bridge version" }
          $expectedBridge = "C4C8B5BC4B26B2B3F3BF2767CDB708546D62F7D0BBB63D24E940C736DA9EFE26"
          $actualBridge = (Get-FileHash "$stage\dlss5-bridge.addon64" -Algorithm SHA256).Hash
          if ($actualBridge -ine $expectedBridge) { throw "Packaged bridge hash mismatch: $actualBridge" }

          $addonSource = Get-Content ".\v2\src\addon.cpp" -Raw
          foreach ($requiredMarker in @(
            "PrepareSyntheticSrRuntime",
            "LOAD_LIBRARY_SEARCH_DLL_LOAD_DIR",
            "CreateHardLinkW",
            "RefreshBridgeRuntimeSnapshot",
            "ApplyGamingStyle",
            "FrameGenProviderInstalled",
            "QueryFrameGenProvider",
            "ApplyCompatibilityMotionPath",
            "ApplyNativeFrameGenPath",
            "FrameGenerationAutoBaseFPS",
            "HUD PROTECTION"
          )) {
            if (-not $addonSource.Contains($requiredMarker)) { throw "RC5 runtime marker missing: $requiredMarker" }
          }

      - name: End-to-end Full Neural state persistence test
        shell: powershell
        run: |
          $stage = (Resolve-Path ".\v2\dist\SecretEMKO-NeuralGraphics-v2.0.0-rc5").Path
          $fake = Join-Path $env:RUNNER_TEMP "SecretEMKO Full Neural Persistence Test"
          $app = Join-Path $fake "FiveM.app"
          New-Item -ItemType Directory -Path $app -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $app "CitizenFX.ini") -Value "[Game]"

          & (Join-Path $stage "tools\Install-SecretEMKO.ps1") -FiveMPath $fake -Mode FullNeural -ForceNeuralStack -SkipStreamline -NonInteractive

          $plugins = Join-Path $app "plugins"
          $ini = Join-Path $plugins "ReShade.ini"
          $bridge = Join-Path $plugins "dlss5-bridge.cfg"
          foreach ($name in @("SecretEMKO.addon64","SecretEMKO-FG.addon64","renodx-dlss5.addon64","dlss5-bridge.addon64","nvngx_dlssnr.dll","nvngx_dlss.dll")) {
            if (-not (Test-Path (Join-Path $plugins $name))) { throw "Missing Full Neural backend: $name" }
          }

          $consumerHash = (Get-FileHash (Join-Path $plugins "renodx-dlss5.addon64") -Algorithm SHA256).Hash
          if ($consumerHash -ine "D5ADF82EB44B065F4C590AC91FE824BAB07AFEA0EB9F994BDE936710C8593952") {
            throw "Installed RenoDX backend is not the live-adapter-compatible v4.70 binary"
          }

          $iniText = Get-Content -LiteralPath $ini -Raw
          $iniText = [regex]::Replace($iniText, '(?m)^NRIntensity=.*$', 'NRIntensity=1.470000')
          $iniText = [regex]::Replace($iniText, '(?m)^NeuralUplift=.*$', 'NeuralUplift=0')
          $iniText = [regex]::Replace($iniText, '(?m)^BackendsNextStart=.*            $iniText,
            '(?m)^DisabledAddons=.*$',
            'DisabledAddons=SECRET EMKO RenoDX backend@renodx-dlss5.addon64,SECRET EMKO DLSS5 bridge@dlss5-bridge.addon64'
          )
          Set-Content -LiteralPath $ini -Value $iniText -Encoding UTF8

          $bridgeText = Get-Content -LiteralPath $bridge -Raw
          $bridgeText = [regex]::Replace($bridgeText, '(?m)^ofa_grid=.*$', 'ofa_grid=1')
          Set-Content -LiteralPath $bridge -Value $bridgeText -Encoding UTF8

          & (Join-Path $stage "tools\Install-SecretEMKO.ps1") -FiveMPath $fake -Mode FullNeural -ForceNeuralStack -SkipStreamline -NonInteractive

          $after = Get-Content -LiteralPath $ini -Raw
          if ($after -notmatch '(?m)^NRIntensity=1\.470000\r?$') { throw "Installer reset NRIntensity" }
          if ($after -notmatch '(?m)^NeuralUplift=0\r?$') { throw "Installer re-enabled Neural Rendering" }
          if ($after -notmatch '(?m)^BackendsNextStart=0\r?            throw "Installer lost DisabledAddons backend policy"
          }
          if ((Get-Content -LiteralPath $bridge -Raw) -notmatch '(?m)^ofa_grid=1\r?$') {
            throw "Installer reset bridge quality state"
          }

          & (Join-Path $stage "tools\Uninstall-SecretEMKO.ps1") -FiveMPath $fake -NonInteractive

      - name: End-to-end RP Visual isolation and restore test
        shell: powershell
        run: |
          $stage = (Resolve-Path ".\v2\dist\SecretEMKO-NeuralGraphics-v2.0.0-rc5").Path
          $fake = Join-Path $env:RUNNER_TEMP "SecretEMKO FiveM Legacy Test"
          $app = Join-Path $fake "FiveM.app"
          $oldPlugins = Join-Path $app "plugins"

          New-Item -ItemType Directory -Path $oldPlugins -Force | Out-Null
          $citizen = "[Game]" + [Environment]::NewLine + "IVPath=C:\Fake\GTAV"
          Set-Content -LiteralPath (Join-Path $app "CitizenFX.ini") -Value $citizen
          Set-Content -LiteralPath (Join-Path $oldPlugins "existing-user-plugin.txt") -Value "preserve-me"
          New-Item -ItemType Directory -Path (Join-Path $oldPlugins "reshade-shaders\Shaders") -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $oldPlugins "reshade-shaders\Shaders\UserCustom.fx") -Value "// user shader"

          & (Join-Path $stage "tools\Install-SecretEMKO.ps1") -FiveMPath $fake -Mode RPVisual -NonInteractive

          $active = Join-Path $app "plugins"
          foreach ($name in @("dxgi.dll","ReShade.ini","Secret_Emko_Main.ini","Secret_Emko_Stream.ini")) {
            if (-not (Test-Path (Join-Path $active $name))) { throw "Missing RP Visual output: $name" }
          }
          if (Test-Path (Join-Path $active "SecretEMKO.addon64")) { throw "External SECRET EMKO add-on must not be active in RP Visual mode" }
          if (Test-Path (Join-Path $active "swapchain_override.addon64")) { throw "External swapchain add-on must not be active in RP Visual mode" }
          if (Test-Path (Join-Path $active "existing-user-plugin.txt")) { throw "Old arbitrary plugin leaked into isolated active plugins folder" }
          if (-not (Test-Path (Join-Path $active "reshade-shaders\Shaders\UserCustom.fx"))) { throw "Existing user shader library was not migrated" }

          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Join-Path $active "dxgi.dll")))
          if (-not $ascii.Contains("only limited add-on functionality")) { throw "RP Visual did not install the limited standard ReShade build" }

          $backup = @(Get-ChildItem -LiteralPath $app -Directory -Filter "plugins.before-secret-emko.*")
          if ($backup.Count -ne 1) { throw "Expected exactly one isolated original plugins backup" }
          if (-not (Test-Path (Join-Path $backup[0].FullName "existing-user-plugin.txt"))) { throw "Original plugin was not preserved in backup" }

          # Re-run the installer to verify idempotent in-place updates.
          & (Join-Path $stage "tools\Install-SecretEMKO.ps1") -FiveMPath $fake -Mode RPVisual -NonInteractive
          $backupAfterUpdate = @(Get-ChildItem -LiteralPath $app -Directory -Filter "plugins.before-secret-emko.*")
          if ($backupAfterUpdate.Count -ne 1) { throw "Second install created another original plugins backup" }
          if (-not (Test-Path (Join-Path $active "reshade-shaders\Shaders\UserCustom.fx"))) { throw "User shader missing after in-place update" }

          & (Join-Path $stage "tools\Uninstall-SecretEMKO.ps1") -FiveMPath $fake -NonInteractive

          if (-not (Test-Path (Join-Path $active "existing-user-plugin.txt"))) { throw "Original plugins folder was not restored by uninstall" }
          if (Test-Path (Join-Path $active "Secret_Emko_Main.ini")) { throw "RP Visual environment remained active after restore" }

      - name: End-to-end missing plugins creation test
        shell: powershell
        run: |
          $stage = (Resolve-Path ".\v2\dist\SecretEMKO-NeuralGraphics-v2.0.0-rc5").Path
          $fake = Join-Path $env:RUNNER_TEMP "SecretEMKO Missing Plugins Test"
          $app = Join-Path $fake "FiveM.app"
          New-Item -ItemType Directory -Path $app -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $app "CitizenFX.ini") -Value "[Game]"

          $plugins = Join-Path $app "plugins"
          if (Test-Path $plugins) { throw "Test precondition failed: plugins already exists" }

          & (Join-Path $stage "tools\Install-SecretEMKO.ps1") -FiveMPath $fake -Mode RPVisual -NonInteractive

          if (-not (Test-Path $plugins)) { throw "Installer did not create missing plugins folder" }
          if (-not (Test-Path (Join-Path $plugins "dxgi.dll"))) { throw "ReShade missing from newly created plugins folder" }
          if (-not (Test-Path (Join-Path $plugins "Secret_Emko_Main.ini"))) { throw "Main preset missing from newly created plugins folder" }

          & (Join-Path $stage "tools\Uninstall-SecretEMKO.ps1") -FiveMPath $fake -NonInteractive

          if (Test-Path $plugins) { throw "Uninstall should leave no active plugins folder when none existed before install" }

      - name: Reject unsupported Full Neural hardware before modification
        shell: powershell
        run: |
          $stage = (Resolve-Path ".\v2\dist\SecretEMKO-NeuralGraphics-v2.0.0-rc5").Path
          $fake = Join-Path $env:RUNNER_TEMP "SecretEMKO Unsupported Neural Test"
          $app = Join-Path $fake "FiveM.app"
          $plugins = Join-Path $app "plugins"
          New-Item -ItemType Directory -Path $plugins -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $app "CitizenFX.ini") -Value "[Game]"
          Set-Content -LiteralPath (Join-Path $plugins "sentinel.txt") -Value "must-remain"

          $failed = $false
          try {
            & (Join-Path $stage "tools\Install-SecretEMKO.ps1") -FiveMPath $fake -Mode FullNeural -NonInteractive
          }
          catch {
            $failed = $true
          }
          if (-not $failed) { throw "Full Neural unexpectedly accepted unsupported runner hardware" }
          if (-not (Test-Path (Join-Path $plugins "sentinel.txt"))) { throw "Installer modified plugins before hardware rejection" }
          if (@(Get-ChildItem -LiteralPath $app -Directory -Filter "plugins.before-secret-emko.*").Count -ne 0) { throw "Installer isolated plugins before hardware rejection" }

      - name: Upload v2 package
        uses: actions/upload-artifact@v4
        with:
          name: SecretEMKO-NeuralGraphics-v2.0.0-rc5
          path: |
            v2/dist/SecretEMKO-NeuralGraphics-v2.0.0-rc5/**
            v2/dist/SecretEMKO-NeuralGraphics-v2.0.0-rc5.zip
          if-no-files-found: error
, 'BackendsNextStart=0')
          $iniText = [regex]::Replace($iniText, '(?m)^GamingStyle=.*            $iniText,
            '(?m)^DisabledAddons=.*$',
            'DisabledAddons=SECRET EMKO RenoDX backend@renodx-dlss5.addon64,SECRET EMKO DLSS5 bridge@dlss5-bridge.addon64'
          )
          Set-Content -LiteralPath $ini -Value $iniText -Encoding UTF8

          $bridgeText = Get-Content -LiteralPath $bridge -Raw
          $bridgeText = [regex]::Replace($bridgeText, '(?m)^ofa_grid=.*$', 'ofa_grid=1')
          Set-Content -LiteralPath $bridge -Value $bridgeText -Encoding UTF8

          & (Join-Path $stage "tools\Install-SecretEMKO.ps1") -FiveMPath $fake -Mode FullNeural -ForceNeuralStack -SkipStreamline -NonInteractive

          $after = Get-Content -LiteralPath $ini -Raw
          if ($after -notmatch '(?m)^NRIntensity=1\.470000\r?$') { throw "Installer reset NRIntensity" }
          if ($after -notmatch '(?m)^NeuralUplift=0\r?$') { throw "Installer re-enabled Neural Rendering" }
          if ($after -notmatch '(?m)^BackendsNextStart=0\r?$') { throw "Installer reset backend load policy" }
          if ($after -notmatch 'renodx-dlss5\.addon64' -or $after -notmatch 'dlss5-bridge\.addon64') {
            throw "Installer lost DisabledAddons backend policy"
          }
          if ((Get-Content -LiteralPath $bridge -Raw) -notmatch '(?m)^ofa_grid=1\r?$') {
            throw "Installer reset bridge quality state"
          }

          & (Join-Path $stage "tools\Uninstall-SecretEMKO.ps1") -FiveMPath $fake -NonInteractive

      - name: End-to-end RP Visual isolation and restore test
        shell: powershell
        run: |
          $stage = (Resolve-Path ".\v2\dist\SecretEMKO-NeuralGraphics-v2.0.0-rc5").Path
          $fake = Join-Path $env:RUNNER_TEMP "SecretEMKO FiveM Legacy Test"
          $app = Join-Path $fake "FiveM.app"
          $oldPlugins = Join-Path $app "plugins"

          New-Item -ItemType Directory -Path $oldPlugins -Force | Out-Null
          $citizen = "[Game]" + [Environment]::NewLine + "IVPath=C:\Fake\GTAV"
          Set-Content -LiteralPath (Join-Path $app "CitizenFX.ini") -Value $citizen
          Set-Content -LiteralPath (Join-Path $oldPlugins "existing-user-plugin.txt") -Value "preserve-me"
          New-Item -ItemType Directory -Path (Join-Path $oldPlugins "reshade-shaders\Shaders") -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $oldPlugins "reshade-shaders\Shaders\UserCustom.fx") -Value "// user shader"

          & (Join-Path $stage "tools\Install-SecretEMKO.ps1") -FiveMPath $fake -Mode RPVisual -NonInteractive

          $active = Join-Path $app "plugins"
          foreach ($name in @("dxgi.dll","ReShade.ini","Secret_Emko_Main.ini","Secret_Emko_Stream.ini")) {
            if (-not (Test-Path (Join-Path $active $name))) { throw "Missing RP Visual output: $name" }
          }
          if (Test-Path (Join-Path $active "SecretEMKO.addon64")) { throw "External SECRET EMKO add-on must not be active in RP Visual mode" }
          if (Test-Path (Join-Path $active "swapchain_override.addon64")) { throw "External swapchain add-on must not be active in RP Visual mode" }
          if (Test-Path (Join-Path $active "existing-user-plugin.txt")) { throw "Old arbitrary plugin leaked into isolated active plugins folder" }
          if (-not (Test-Path (Join-Path $active "reshade-shaders\Shaders\UserCustom.fx"))) { throw "Existing user shader library was not migrated" }

          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Join-Path $active "dxgi.dll")))
          if (-not $ascii.Contains("only limited add-on functionality")) { throw "RP Visual did not install the limited standard ReShade build" }

          $backup = @(Get-ChildItem -LiteralPath $app -Directory -Filter "plugins.before-secret-emko.*")
          if ($backup.Count -ne 1) { throw "Expected exactly one isolated original plugins backup" }
          if (-not (Test-Path (Join-Path $backup[0].FullName "existing-user-plugin.txt"))) { throw "Original plugin was not preserved in backup" }

          # Re-run the installer to verify idempotent in-place updates.
          & (Join-Path $stage "tools\Install-SecretEMKO.ps1") -FiveMPath $fake -Mode RPVisual -NonInteractive
          $backupAfterUpdate = @(Get-ChildItem -LiteralPath $app -Directory -Filter "plugins.before-secret-emko.*")
          if ($backupAfterUpdate.Count -ne 1) { throw "Second install created another original plugins backup" }
