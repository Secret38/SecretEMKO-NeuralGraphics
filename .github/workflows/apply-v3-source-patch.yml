name: Apply readable v3 source patch

on:
  push:
    branches: [ v3-17-alpha1-player-test ]
    paths:
      - ".source-patch/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct the readable unified diff
        shell: bash
        run: |
          set -euo pipefail
          cat .source-patch/part-*.patchpart > "$RUNNER_TEMP/v3-source.patch"
          git apply --check "$RUNNER_TEMP/v3-source.patch"
          git apply --index "$RUNNER_TEMP/v3-source.patch"

      - name: Remove one-time transport files
        shell: bash
        run: |
          git rm -r .source-patch
          git rm .github/workflows/apply-v3-source-patch.yml

      - name: Commit normal source files
        shell: bash
        run: |
          git config user.name "SECRET EMKO"
          git config user.email "188336729+Secret38@users.noreply.github.com"
          git commit -m "v3.16.0: readable source and player-test pipeline"
          git push origin HEAD:v3-17-alpha1-player-test
